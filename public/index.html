<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#ff9500" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dash-Q" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Dash-Q - Smart Queue Management System for Barbershops. Join queues, book appointments, and track your position in real-time." />
    <meta name="keywords" content="barbershop, queue, appointment, booking, haircut, barber" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Dash-Q Queue Management" />
    <meta property="og:description" content="Smart Queue Management System for Barbershops" />
    <meta property="og:type" content="website" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- iOS Splash Screen Support -->
    <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/logo192.png" />
    
    <!-- Icons -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="%PUBLIC_URL%/logo192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon.ico" />
    
    <title>Dash-Q | Smart Queue Management</title>
    
    <!-- Preconnect to API for faster loading -->
    <link rel="preconnect" href="https://your-api-domain.com" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <style>
        .pre-loader {
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          height: 100vh; background-color: #121212; color: #ff9500; font-family: sans-serif;
        }
        .pre-spinner {
          width: 40px; height: 40px; border: 4px solid rgba(255, 149, 0, 0.3);
          border-top-color: #ff9500; border-radius: 50%;
          animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
      <div class="pre-loader" id="preloader">
        <div class="pre-spinner"></div>
        <h2>Dash-Q</h2>
        <p style="font-size: 0.9rem; opacity: 0.8;">Loading app...</p>
      </div>
    </div>
    
    <!-- Enhanced Pre-loader + Mobile-Safe SW -->
    <script>
      // 1. Hide pre-loader safely
      const hidePreloader = () => {
        const preloader = document.getElementById('preloader');
        if (preloader) {
          preloader.style.opacity = '0';
          preloader.style.transition = 'opacity 0.5s ease-out';
          setTimeout(() => {
            preloader.style.display = 'none';
          }, 500);
        }
      };

      // Hide after timeout or when React mounts
      setTimeout(hidePreloader, 3000);
      window.addEventListener('DOMContentLoaded', hidePreloader);
      document.addEventListener('readystatechange', () => {
        if (document.readyState === 'interactive') hidePreloader();
      });

      // 2. Mobile-Safe Service Worker (only non-iOS or dev)
      if ('serviceWorker' in navigator) {
        // Skip aggressive SW on iOS Safari (common black screen cause)
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIOS) {
          console.log('iOS detected - skipping SW for better compatibility');
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then((registration) => {
                console.log('SW registered: ', registration);
              })
              .catch((registrationError) => {
                console.warn('SW registration failed (ok on first load): ', registrationError);
              });
          });
        }

        // Softer update handling
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          console.log('New SW active - soft reload');
          if (confirm('New version available. Reload?')) {
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
